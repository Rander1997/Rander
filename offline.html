<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منطقة السكون الكوني | متجر راندر 2100</title>
    <style>
        :root {
            --bg-deep: #030508;
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --text-main: #e2e8f0;
            --text-muted: #8a99ad;
            --glass-bg: rgba(10, 18, 32, 0.4);
            --glass-border: rgba(0, 242, 254, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* خلفية نيونية متحركة هادئة جداً */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -2;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* شبكة مستقبلية دقيقة بخطوط خفيفة */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* البطاقة الرئيسية بتصميم 2100 المتقن */
        .future-card {
            width: 85%;
            max-width: 440px;
            padding: 45px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardFloat 6s infinite ease-in-out;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* أيقونة هولوغرامية هادئة */
        .hologram-icon {
            font-size: 60px;
            margin-bottom: 25px;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));
            animation: iconPulse 3s infinite alternate ease-in-out;
        }

        @keyframes iconPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* زر مستقبلي زجاجي متفاعل */
        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(135deg, rgba(0,242,254,0.1), rgba(79,172,254,0.2));
            border: 1px solid rgba(0,242,254,0.4);
            border-radius: 14px;
            color: var(--neon-cyan);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .cyber-btn:hover {
            background: linear-gradient(135deg, rgba(0,242,254,0.25), rgba(79,172,254,0.35));
            color: #ffffff;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            transform: scale(1.02);
        }

        .cyber-btn:active {
            transform: scale(0.98);
        }

        /* مؤشر النظام الهادئ في الأسفل */
        .system-status {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(138, 153, 173, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="grid-overlay"></div>

    <div class="future-card">
        <div class="hologram-icon">🐒</div>
        <h1>ويـن رايـح يـمعود؟</h1>
        <p>روح كنك حتى تگدر تتسوگ من رانـدر</p>
        
        <button onclick="window.location.reload()" class="cyber-btn">
            إعادة مزامنة الاتصال
        </button>

        <div class="system-status">Rander OS // v21.0.4</div>
    </div>

</body>
</html>
