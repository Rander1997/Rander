<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل بالإنترنت | متجر راندر</title>
    <style>
        /* تصميم مستقبلي داكن */
        body {
            margin: 0;
            padding: 0;
            background-color: #05070a; /* لون خلفية أسود مزرق عميق */
            color: #e0e6ed;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        /* حاوية المحتوى */
        .offline-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(20, 30, 45, 0.6); /* خلفية شفافة قليلاً */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2c3e50;
            backdrop-filter: blur(10px); /* تأثير ضبابي للخلفية */
            animation: fadeIn 1s ease-in-out;
        }

        /* أيقونة مستقبلية متحركة (سفينة فضاء) */
        .icon-container {
            font-size: 80px;
            margin-bottom: 30px;
            animation: float 3s infinite ease-in-out;
        }

        /* العنوان */
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #3498db; /* لون أزرق مستقبلي */
            text-shadow: 0 0 15px rgba(52, 152, 219, 0.7);
        }

        /* النص */
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #bdc3c7;
            margin-bottom: 30px;
        }

        /* زر إعادة المحاولة */
        .retry-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            border-radius: 50px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6);
        }

        /* تأثيرات متحركة */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* خطوط خلفية مستقبلية خفيفة */
        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                linear-gradient(to right, #1a2533 1px, transparent 1px),
                linear-gradient(to bottom, #1a2533 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: moveLines 20s linear infinite;
        }

        @keyframes moveLines {
            from { background-position: 0 0; }
            to { background-position: 50px 50px; }
        }

    </style>
</head>
<body>
    <div class="bg-lines"></div>
    <div class="offline-container">
        <div class="icon-container">
            🚀
        </div>
        <h1>فقدان الاتصال بالشبكة</h1>
        <p>يبدو أن سفينتك الرقمية تحتاج إلى وقود الإنترنت لتعاود الطيران!<br>يرجى إعادة الاتصال بالشبكة وسنكون في انتظارك.</p>
        <button onclick="window.location.reload()" class="retry-btn">إعادة المحاولة</button>
    </div>
</body>
</html>
